# Luoyu plugin configuration.
#
# Mounted at $DSH_HOME/cordis.patch.yml, i.e. the Harness *home* patch layer:
# it is applied over every bundle layer, so the values here win over the
# plugin's own defaults and can be edited by the Settings → Luoyu page.
#
# Every key below is optional; omitted keys fall back to the schema defaults in
# src/config.ts. Secrets (the OneBot accessToken) live in
# luoyu.local.patch.yml — a sibling overlay that is never committed.

- id: dsh-luoyu
  config:
    # The bot workspace — mounted from the host at this path by compose.
    workspaceDir: /workspace
    timeZone: Asia/Shanghai
    # The plugin talks to the dedicated NapCat container over the compose
    # network (see the `napcat` service in docker-compose.yml).
    napcatMode: external
    wsUrl: ws://napcat:3001
    httpUrl: http://napcat:3000
    autoStart: false
    privateReply: true
    groupReply: balanced
    permissionPreset: danger-full-access
    maxReplyChars: 1500
